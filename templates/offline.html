<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f5c32">
    <title>Offline — Presensi SMPM 22</title>
    <link rel="icon" href="/static/icons/favicon-32.png" type="image/png">
    <style>
        body {
            min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px; background: #f4f7f5; color: #14281d; font-family: "Segoe UI", sans-serif; text-align: center;
        }
        .kotak { width: min(420px, 100%); background: #fff; border: 1px solid #d5e4da; border-radius: 20px; padding: 28px 22px; }
        img { width: 88px; height: auto; display: block; margin: 0 auto 12px; }
        h1 { font-size: 1.25rem; color: #0f5c32; margin: 0 0 8px; }
        p { color: #3e5c4b; margin: 0 0 18px; }
        a {
            display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px;
            background: #0f5c32; color: #fff; text-decoration: none; border-radius: 12px; font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="kotak">
        <img src="/static/logo_smp.jpeg" alt="Logo SMP Muhammadiyah 22 Pamulang">
        <h1>Tidak ada koneksi</h1>
        <p>Buka lagi setelah internet tersambung. Data presensi dan laporan tetap butuh jaringan.</p>
        <a href="/login">Coba lagi</a>
    </main>
</body>
</html>
